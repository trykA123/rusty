# Ferrite's built-in keymap. One [[bind]] per command and context.
# keys use GPUI keystroke syntax; context defaults to the command's home context.

# global

[[bind]]
command = "app_menu.toggle"
keys = ["f10"]

[[bind]]
command = "settings.toggle"
keys = ["ctrl-,"]

[[bind]]
command = "jobs.toggle"
keys = ["ctrl-j"]

[[bind]]
command = "sheet.narrower"
keys = ["ctrl-["]

[[bind]]
command = "sheet.wider"
keys = ["ctrl-]"]

