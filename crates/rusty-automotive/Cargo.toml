[package]
name = "rusty-automotive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
a2lfile = { version = "=3.5.1", default-features = false }
can-dbc = { version = "=10.0.0", default-features = false }
cpp_demangle = "=0.4.5"
gimli = { version = "=0.32.3", default-features = false, features = ["read", "std"] }
object = { version = "=0.37.3", default-features = false, features = [
    "elf",
    "read_core",
    "std",
    "unaligned",
] }
rustc-demangle = "=0.1.28"
thiserror = "2.0.21"

[features]
sample = ["gimli/write", "object/write_std"]

[dev-dependencies]
proptest = "1.12.0"
rusty-automotive = { path = ".", features = ["sample"] }

[lints]
workspace = true
