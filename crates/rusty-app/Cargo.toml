[package]
name = "rusty-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "ferrite"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
encoding_rs = "0.8.42"
rusty-cache = { path = "../rusty-cache" }
rusty-core = { path = "../rusty-core" }
rusty-diag = { path = "../rusty-diag" }
rusty-fs = { path = "../rusty-fs" }
rusty-shell = { path = "../rusty-shell" }
rusty-store = { path = "../rusty-store" }
rusty-ui = { path = "../rusty-ui" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "registry", "std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_ProcessStatus",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
insta = "1.49.0"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }

[build-dependencies]
embed-resource = "3.0.12"

[lints]
workspace = true
