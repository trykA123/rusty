[package]
name = "rusty-index"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
test-support = []

[dependencies]
crc32fast = "=1.5.2"
nucleo-matcher = "=0.3.1"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
rayon = "=1.12.0"
rusty-core = { path = "../rusty-core" }
rusty-fs = { path = "../rusty-fs" }
rusty-store = { path = "../rusty-store" }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tracing = "0.1.44"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
