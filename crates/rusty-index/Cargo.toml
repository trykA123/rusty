[package]
name = "rusty-index"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
crc32fast = "=1.5.2"
nucleo-matcher = "=0.3.1"
rayon = "=1.12.0"
rusty-core = { path = "../rusty-core" }
rusty-fs = { path = "../rusty-fs" }
rusty-store = { path = "../rusty-store" }
thiserror = "2.0.21"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
