:root{
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-7:48px;
  --radius-s:4px;--radius-m:8px;--radius-l:12px;
  --fs-s:0.75rem;--fs-m:0.8125rem;--fs-l:0.875rem;--fs-xl:1rem;--fs-2xl:1.25rem;--fs-3xl:2.25rem;
  --ease:cubic-bezier(.2,.7,.2,1);--dur:150ms;
  --font:var(--brand-font,'IBM Plex Sans'),system-ui,sans-serif;
}
*{box-sizing:border-box}
html{color-scheme:light}
html[data-theme="dark"]{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--text);font:400 var(--fs-xl)/1.5 var(--font);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;line-height:1.2;font-weight:600}
h1{font-size:var(--fs-2xl)}h2{font-size:var(--fs-2xl)}h3{font-size:var(--fs-l);color:var(--muted);text-transform:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1200px;margin-inline:auto;padding:var(--space-4)}
header.top{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--border);padding-block:var(--space-3)}
.bar{display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center;justify-content:space-between}
.picker{display:flex;flex-wrap:wrap;gap:var(--space-1);padding:var(--space-1);background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius-m)}
.picker button,.btn{min-height:36px;padding:0 var(--space-3);border:0;border-radius:var(--radius-s);background:transparent;cursor:pointer;font-size:var(--fs-l);font-weight:500}
.picker button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.picker button:hover:not([aria-pressed="true"]){background:var(--selected)}
.btn{background:var(--surface);border:1px solid var(--border-strong)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn:hover{background:color-mix(in oklch,var(--surface) 88%,var(--accent))}
.btn.primary:hover{background:color-mix(in oklch,var(--accent) 88%,black)}
.actions{display:flex;gap:var(--space-2);flex-wrap:wrap}
section{margin-block:var(--space-6)}
.intro{display:grid;gap:var(--space-2);margin-bottom:var(--space-5)}
.basis{margin:0;color:var(--muted);max-width:70ch}
.grid{display:grid;gap:var(--space-4)}
.cols{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-l);padding:var(--space-4);display:grid;gap:var(--space-3);align-content:start;min-width:0}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:var(--space-2)}
.sw div{border:1px solid var(--border);border-radius:var(--radius-s);overflow:hidden;font-size:var(--fs-s);background:var(--raised)}
.sw i{display:block;height:40px}
.sw span{display:block;padding:var(--space-1) var(--space-2);line-height:1.3}
.sw b{font-weight:600;display:block}
.brandrow{display:flex;flex-wrap:wrap;gap:var(--space-5);align-items:center}
.word{font-size:var(--fs-3xl);font-weight:600;line-height:1.1;letter-spacing:-0.01em}
.word u{text-decoration:none;color:var(--accent-text)}
.wsmall{font-size:var(--fs-2xl);font-weight:600}
.icons{display:flex;gap:var(--space-4);align-items:flex-end}
.icons figure{margin:0;display:grid;gap:var(--space-1);justify-items:center;font-size:var(--fs-s);color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:var(--fs-m)}
th,td{text-align:left;padding:var(--space-1) var(--space-2);border-bottom:1px solid var(--border);white-space:nowrap}
th{color:var(--muted);font-weight:500}
@media (max-width:520px){.hs{display:none}td:first-child{white-space:normal}}
.scroll{overflow-x:auto}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:var(--radius-s);font-size:var(--fs-s);font-weight:600}
.demo{display:inline-block;padding:0 var(--space-2);border-radius:var(--radius-s);font-weight:600}
.pass{color:var(--success)}.fail{color:var(--danger)}
.pass,.fail{display:inline-flex;gap:4px;align-items:center;font-weight:600}
.cvd{display:grid;gap:var(--space-2)}
.cvdrow{display:grid;grid-template-columns:7rem 1fr;gap:var(--space-2);align-items:center;font-size:var(--fs-m)}
.pair{display:flex;gap:var(--space-2);flex-wrap:wrap;align-items:center}
.pair .chip{background:var(--bgc);color:var(--fgc);border:1px solid var(--fgc)}
.note{font-size:var(--fs-m);color:var(--muted);margin:0}
svg.i{width:14px;height:14px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.app{container-type:inline-size;border:1px solid var(--border-strong);border-radius:var(--radius-l);overflow:hidden;background:var(--bg);font-size:var(--fs-m);line-height:1.3}
.tabs{display:flex;gap:2px;padding:var(--space-1) var(--space-2) 0;background:var(--bg);border-bottom:1px solid var(--border);overflow:hidden}
.tab{padding:6px 12px;border-radius:var(--radius-s) var(--radius-s) 0 0;color:var(--muted);white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{background:var(--surface);color:var(--text);box-shadow:inset 0 2px 0 var(--accent);font-weight:600}
.panes{display:grid;grid-template-columns:1fr 1fr;background:var(--border);gap:1px}
@container (max-width:620px){.panes{grid-template-columns:1fr}.pane.second{display:none}.c-date{display:none}}
.pane{background:var(--surface);min-width:0}
.path{display:flex;gap:6px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--border);color:var(--muted);background:var(--raised);overflow:hidden;white-space:nowrap}
.path b{color:var(--text);font-weight:600}
.row,.head{display:grid;grid-template-columns:18px 1fr 70px 82px;gap:8px;align-items:center;padding:4px 10px;border-left:3px solid transparent}
@container (max-width:620px){.row,.head{grid-template-columns:18px 1fr 70px}}
.head{color:var(--muted);font-size:var(--fs-s);border-bottom:1px solid var(--border);padding-block:4px}
.row .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s,.row .d{color:var(--muted);text-align:right;white-space:nowrap}
.row svg{color:var(--muted)}
.row.dir svg{color:var(--accent-text)}
.row.marked{color:var(--secondary-text);font-weight:600}
.row.marked .s,.row.marked svg{color:var(--secondary-text)}
.row.cursor{background:var(--selected);border-left-color:var(--accent)}
.row.cursor .s,.row.cursor .d{color:var(--text)}
.row.cursor.inactive{background:transparent;border-left-color:var(--border-strong);box-shadow:inset 0 0 0 1px var(--border-strong)}
.status{display:flex;flex-wrap:wrap;gap:6px 16px;padding:6px 10px;background:var(--raised);border-top:1px solid var(--border);color:var(--muted);align-items:center}
.status b{color:var(--text);font-weight:600}
.status .st{display:inline-flex;gap:5px;align-items:center;font-weight:600}
.fkeys{display:flex;gap:1px;background:var(--border);border-top:1px solid var(--border)}
.fkeys span{flex:1;padding:5px 2px;background:var(--surface);text-align:center;font-size:var(--fs-s);color:var(--muted);white-space:nowrap;overflow:hidden}
.fkeys kbd{font:inherit;font-weight:600;color:var(--accent-text);margin-right:3px}
@container (max-width:520px){.fkeys span:nth-child(n+5){display:none}}
@media (prefers-reduced-motion:no-preference){.picker button,.btn{transition:background-color var(--dur) var(--ease)}}
.toast{position:fixed;inset-block-end:var(--space-4);inset-inline:var(--space-4);margin-inline:auto;width:fit-content;max-width:90vw;background:var(--text);color:var(--bg);padding:var(--space-2) var(--space-4);border-radius:var(--radius-m);opacity:0;transform:translateY(8px);pointer-events:none}
.toast.show{opacity:1;transform:none}
@media (prefers-reduced-motion:no-preference){.toast{transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease)}}
</style>
</head>
<body>
<header class="top"><div class="wrap bar">
  <div style="display:grid;gap:2px"><h1>Brand palettes: Tern and Sift</h1></div>
  <div class="actions">
    <div class="picker" role="group" aria-label="Direction" id="picker"></div>
    <button class="btn" id="theme" type="button" aria-label="Toggle light and dark theme">Theme: <span id="themeName">light</span></button>
    <button class="btn primary" id="copy" type="button">Copy tokens (TOML)</button>
  </div>
</div></header>
<main class="wrap" id="main"></main>

 '<div class="fkeys"><span><kbd>F3</kbd>View</span><span><kbd>F4</kbd>Edit</span><span><kbd>F5</kbd>Copy</span><span><kbd>F6</kbd>Move</span><span><kbd>F7</kbd>Folder</span><span><kbd>F8</kbd>Delete</span></div></div>';
}
function render(){
 const d=cur(),T=d.themes[st.theme];
 root.dataset.dir=d.id;root.dataset.theme=st.theme;root.style.setProperty('--brand-font',"'"+d.font+"'");
 $('#themeName').textContent=st.theme;
 $('#picker').innerHTML=DATA.map(x=>'<button type="button" data-id="'+x.id+'" aria-pressed="'+(x.id===st.dir)+'">'+x.name+' '+x.n+'</button>').join('');
 const sw=KEYS.map(k=>'<div><i style="background:var(--'+k.replace(/[A-Z]/g,m=>'-'+m.toLowerCase())+')"></i><span><b>'+NAMES[k]+'</b>'+T.tokens[k].hex+'<br>'+T.tokens[k].oklch.replace('oklch','')+'</span></div>').join('');
 const pairs=T.pairs.map(p=>{const ok=p.ratio>=p.min;return '<tr><td>'+p.label+'</td><td class="hs"><span class="demo" style="color:'+p.fg+';background:'+p.bg+';border:1px solid var(--border)">Aa 12</span></td><td>'+p.ratio.toFixed(2)+':1</td><td>'+p.min+'</td><td><span class="'+(ok?'pass':'fail')+'">'+(ok?ic.ok+'pass':ic.bad+'fail')+'</span></td></tr>'}).join('');
 const cv=(label,o,live)=>{
  const bg='var(--surface)';
  const okc=live?'var(--success)':o.ok,badc=live?'var(--danger)':o.bad;
  return '<div class="cvdrow"><span>'+label+'</span><span class="pair"><span class="chip" style="--bgc:'+bg+';--fgc:'+okc+'">'+ic.ok+'Done</span><span class="chip" style="--bgc:'+bg+';--fgc:'+badc+'">'+ic.bad+'Error</span><span class="note">dE '+o.dE+', dL '+o.dL+'</span></span></div>'};
 $('#main').innerHTML=
 '<section><div class="intro"><h2>'+d.name+' '+d.n+': '+d.title+'</h2><p class="basis">'+d.basis+' Font: '+d.font+'.</p></div>'+
 '<div class="grid cols"><div class="card"><h3>Name and app icon</h3><div class="brandrow"><div class="word">'+d.name.toLowerCase()+'<u>_</u></div></div><div class="wsmall">'+d.name+'</div><div class="icons"><figure>'+iconSvg(d,64)+'64 px</figure><figure>'+iconSvg(d,16,true)+'16 px</figure><figure>'+iconSvg(d,32,true)+'32 px</figure></div></div>'+
 '<div class="card"><h3>Tokens ('+st.theme+')</h3><div class="sw">'+sw+'</div></div></div></section>'+
 '<section><h3 style="margin-bottom:var(--space-3)">App mock ('+st.theme+')</h3>'+mock(d)+'</section>'+
 '<section class="grid cols"><div class="card"><h3>Contrast, WCAG AA ('+st.theme+')</h3><div class="scroll"><table><thead><tr><th>Pair</th><th class="hs">Sample</th><th>Ratio</th><th>Min</th><th></th></tr></thead><tbody>'+pairs+'</tbody></table></div></div>'+
 '<div class="card"><h3>Colour-blind check: success vs danger ('+st.theme+')</h3><div class="cvd">'+cv('Normal',T.cvd.normal,true)+cv('Deuteranopia',T.cvd.deut)+cv('Protanopia',T.cvd.prot)+'</div><p class="note">Machado 2009 matrices at full severity, dE is the OKLab distance after simulation, dL the lightness gap. Success and danger are also separated by lightness, and every status carries a glyph and a word.</p></div></section>';
}
$('#picker').addEventListener('click',e=>{const b=e.target.closest('button');if(b){st.dir=b.dataset.id;render()}});
$('#theme').addEventListener('click',()=>{st.theme=st.theme==='dark'?'light':'dark';render()});
function toml(d){
 const out=['# '+d.name+' '+d.n+': '+d.title,'# '+d.basis,'[brand]','name = "'+d.name+'"','direction = "'+d.title+'"','font = "'+d.font+'"','icon_light = "'+d.mono+'"','icon_small = "'+d.mono16+'"',''];
 for(const m of ['light','dark']){out.push('[theme.'+m+']');for(const k of KEYS){out.push(k.replace(/[A-Z]/g,c=>'_'+c.toLowerCase())+' = "'+d.themes[m].tokens[k].hex+'"  # '+d.themes[m].tokens[k].oklch)}out.push('')}
 return out.join('\n');
}
$('#copy').addEventListener('click',async()=>{
 const t=toml(cur());let ok=true;
 try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();ok=document.execCommand('copy');a.remove()}
 const el=$('#toast');el.textContent=ok?'Copied '+cur().name+' '+cur().n+' tokens as TOML':'Copy failed';el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800);
});
window.__toml=()=>toml(cur());
render();
</script>
</body>
</html>
