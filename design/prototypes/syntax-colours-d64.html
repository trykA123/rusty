(\"constructor\", ok(87., 0.04, 238.)),\n    (\"operator\", ok(70., 0.028, 230.)),\n    (\"punctuation.delimiter\", ok(72., 0.016, 260.)),\n    (\"punctuation.bracket\", ok(72., 0.016, 260.)),\n    (\"embedded\", ok(83., 0.028, 30.)),\n    (\"title\", ok(69., 0.095, 18.), /* bold */),\n    (\"link_text\", ok(80., 0.065, 210.)),\n    (\"link_uri\", ok(83., 0.028, 30.), /* underline */),\n    (\"text.literal\", ok(75., 0.095, 40.)),</pre></details><h3>Colour theory</h3><div class=\"theory\"><p>Anchor and complement: rust 40 for keywords, patina 205 for functions (165° apart). These are the two roles most often side by side. The pair also sits on the blue–yellow axis, which red-green colour-blind readers still see.</p><p>Split-complementary: the two halves of the wheel flank the pair. Warm side, analogous to rust: oxblood 18 (tags, self, headings), bronze 65 (attributes), ochre 82 (types). Cool side, flanking patina: verdigris 155 (strings), slate 238 (constructors), pewter 280 (properties). Plum 330 (literals) and rose 355 (escapes, regex) close the gap between the cool and warm sides.</p><p>Neighbours are kept apart. String vs escape: verdigris and rose, near complements, and escapes are bold. Property vs number (JSON keys and values): pewter at low chroma and plum, 50° apart. Type vs function (Regex::new): ochre and patina. Keyword vs self: rust and oxblood, 22° apart; self is also italic and darker.</p><p>Calm level as direction 4: chroma 0.06–0.125 in light and 0.04–0.095 in dark. Hue does most of the work. Lightness varies inside a narrow band (41–50 light, 69–87 dark), and those small steps separate the warm roles: in light, type 41, tag 43, attribute 46, keyword 50. Operators are a near-neutral steel and punctuation is muted. Comments are a warm iron grey; self, doc comments, escapes and headings use italic or bold.</p><p>Ferrite blue 262 (accent, selection, links in the UI) is left out of the syntax roles. The nearest role is slate 238 for constructors, at chroma 0.04–0.07 and 24° away, so it does not read as a link or selection. Markdown link text uses patina, not blue.</p><p>Colour vision (Machado 2009 simulation, table below): the key pairs keep ΔE 9 or more under deuteranopia and protanopia. These are keyword/function, keyword/type, type/function, type/constructor and property/string. Rust, bronze, ochre and oxblood collapse toward one brown family, so the warm roles rely on the lightness steps. The weakest pairs are rare neighbours: keyword/attribute under protanopia in light (1.3), constructor/number and property/number under protanopia in light (2.6, 2.9) and tag/attribute under deuteranopia in light (3.2). Each of these also differs in shape: attributes sit inside #[…], constructors are capitalised, and JSON keys are quoted.</p></div>\n<div class=\"tablewrap\"><table><caption>Neighbour pairs, ΔE in OKLab ×100 (normal, deuteranopia, protanopia; Machado 2009 simulation). Under 8 is shown bold; those pairs also differ in style, lightness or position.</caption><thead><tr><th scope=\"col\">Pair</th><th scope=\"col\">Light</th><th scope=\"col\">deutan</th><th scope=\"col\">protan</th><th scope=\"col\">Dark</th><th scope=\"col\">deutan</th><th scope=\"col\">protan</th></tr></thead><tbody><tr><th scope=\"row\"><span class=\"r-keyword\">keyword</span> / <span class=\"r-function\">function</span></th><td>20.0</td><td>13.6</td><td>11.7</td><td>16.7</td><td>11.1</td><td>13.6</td></tr><tr><th scope=\"row\"><span class=\"r-keyword\">keyword</span> / <span class=\"r-type\">type</span></th><td>12.4</td><td>9.5</td><td class=\"low\">5.2</td><td>11.9</td><td>9.9</td><td>12.6</td></tr><tr><th scope=\"row\"><span class=\"r-keyword\">keyword</span> / <span class=\"r-variable-special\">variable.special</span></th><td>8.4</td><td>8.3</td><td>8.9</td><td class=\"low\">7.0</td><td class=\"low\">6.9</td><td class=\"low\">7.1</td></tr><tr><th scope=\"row\"><span class=\"r-keyword\">keyword</span> / <span class=\"r-constant\">constant</span></th><td>13.1</td><td>13.3</td><td>13.5</td><td>10.1</td><td>10.1</td><td>10.6</td></tr><tr><th scope=\"row\"><span class=\"r-keyword\">keyword</span> / <span class=\"r-attribute\">attribute</span></th><td class=\"low\">7.7</td><td class=\"low\">5.1</td><td class=\"low\">1.3</td><td class=\"low\">6.7</td><td class=\"low\">4.9</td><td class=\"low\">7.0</td></tr><tr><th scope=\"row\"><span class=\"r-type\">type</span> / <span class=\"r-function\">function</span></th><td>15.6</td><td>13.6</td><td>15.8</td><td>13.5</td><td>12.8</td><td>9.8</td></tr><tr><th scope=\"row\"><span class=\"r-type\">type</span> / <span class=\"r-constructor\">constructor</span></th><td>14.7</td><td>14.3</td><td>14.2</td><td>11.4</td><td>11.2</td><td>11.4</td></tr><tr><th scope=\"row\"><span class=\"r-type\">type</span> / <span class=\"r-attribute\">attribute</span></th><td class=\"low\">5.7</td><td class=\"low\">5.2</td><td class=\"low\">5.0</td><td class=\"low\">5.7</td><td class=\"low\">5.5</td><td class=\"low\">5.9</td></tr><tr><th scope=\"row\"><span class=\"r-function\">function</span> / <span class=\"r-string\">string</span></th><td>9.6</td><td>9.5</td><td>9.6</td><td class=\"low\">7.9</td><td class=\"low\">7.9</td><td class=\"low\">7.9</td></tr><tr><th scope=\"row\"><span class=\"r-function\">function</span> / <span class=\"r-constructor\">constructor</span></th><td class=\"low\">7.0</td><td class=\"low\">6.5</td><td class=\"low\">7.1</td><td class=\"low\">7.8</td><td class=\"low\">7.1</td><td class=\"low\">5.8</td></tr><tr><th scope=\"row\"><span class=\"r-string\">string</span> / <span class=\"r-string-escape\">string.escape</span></th><td>20.2</td><td class=\"low\">7.8</td><td>15.3</td><td>14.8</td><td class=\"low\">7.4</td><td class=\"low\">7.2</td></tr><tr><th scope=\"row\"><span class=\"r-string\">string</span> / <span class=\"r-string-regex\">string.regex</span></th><td>20.2</td><td class=\"low\">7.8</td><td>15.3</td><td>14.8</td><td class=\"low\">7.4</td><td class=\"low\">7.2</ const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
let current = 0;
function moveHighlight() { const el = items[current]; highlight.style.width = el.offsetWidth + 'px'; highlight.style.transform = `translateX(${el.offsetLeft}px)`; }
function mount(i) { stage.innerHTML = ''; requestAnimationFrame(() => { stage.innerHTML = variants[i](); }); }
function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => { el.toggleAttribute('data-active', j === i); if (j === i) el.setAttribute('aria-current', 'true'); else el.removeAttribute('aria-current'); });
  moveHighlight();
  const url = new URL(location); url.searchParams.set('v', i + 1); history.replaceState(null, '', url);
  mount(i);
}
items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
window.addEventListener('resize', moveHighlight);
const root = document.documentElement, themeBtn = document.getElementById('theme');
const sysDark = matchMedia('(prefers-color-scheme: dark)');
const isDark = () => root.dataset.theme ? root.dataset.theme === 'dark' : sysDark.matches;
const label = () => { themeBtn.textContent = isDark() ? 'Light theme' : 'Dark theme'; };
sysDark.addEventListener('change', label);
const reduce = matchMedia('(prefers-reduced-motion: reduce)');
function toggleTheme() {
  const apply = () => { root.dataset.theme = isDark() ? 'light' : 'dark'; label(); stage.classList.remove('fading'); };
  if (reduce.matches) return apply();
  stage.classList.add('fading');
  setTimeout(apply, 160);
}
themeBtn.addEventListener('click', toggleTheme);
label();
document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 't' || e.key === 'T') toggleTheme();
});
setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 5) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
