<title>Commander Prototypes</title>
<style>
  @font-face { font-family: "Hanken"; src: url("prototype/fonts/Hanken.ttf"); font-weight: 100 900; }
  @font-face { font-family: "JetBrains Mono"; src: url("prototype/fonts/JetBrainsMono.ttf"); font-weight: 100 800; }
  @font-face { font-family: "Archivo"; src: url("prototype/fonts/Archivo.ttf"); font-weight: 100 900; font-stretch: 62% 125%; }
  @font-face { font-family: "Bricolage"; src: url("prototype/fonts/Bricolage.ttf"); font-weight: 200 800; font-stretch: 75% 100%; }
  @font-face { font-family: "Google Sans Flex"; src: url("prototype/fonts/GoogleSansFlex.ttf"); font-weight: 1 1000; font-stretch: 25% 151%; }
  :root { color-scheme: light dark; --h-bg: #e6e8ec; --h-text: #1c2230; --h-muted: #5a6273; --h-line: #c9ced8; --h-chip: #f6f7f9; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --h-bg: #101318; --h-text: #e8ebf1; --h-muted: #9aa3b5; --h-line: #2a303b; --h-chip: #191d24; color-scheme: dark; } }
  :root[data-theme="dark"] { --h-bg: #101318; --h-text: #e8ebf1; --h-muted: #9aa3b5; --h-line: #2a303b; --h-chip: #191d24; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--h-bg); color: var(--h-text); font: 13px/1.4 system-ui, sans-serif; }
  .harness { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--h-line); position: sticky; top: 0; background: var(--h-bg); z-index: 50; }
  .harness h1 { font-size: 13px; margin: 0 6px 0 0; }
  .g { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; min-width: 0; }
  .g > span { color: var(--h-muted); margin-right: 4px; }
  .harness button { font: inherit; color: var(--h-text); background: var(--h-chip); border: 1px solid var(--h-line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  .harness button[aria-pressed="true"] { background: var(--h-text); color: var(--h-bg); border-color: var(--h-text); }
  .hint { color: var(--h-muted); }
  .sepbar { width: 1px; height: 18px; background: var(--h-line); margin: 0 4px; }
  .stage { display: grid; place-items: start center; padding-block: 24px 48px; padding-inline: 16px; overflow: hidden; }
  .harness b { font-weight: 600; }
  @media (max-width: 700px) { .hint { display: none; } }
  .fit { position: relative; max-width: 100%; overflow: hidden; border-radius: 10px; box-shadow: 0 30px 70px -24px rgb(0 0 0 / 0.5), 0 2px 6px rgb(0 0 0 / 0.2); }
  .frame { position: absolute; left: 0; top: 0; overflow: hidden; border-radius: 10px; box-shadow: 0 30px 70px -24px rgb(0 0 0 / 0.5), 0 2px 6px rgb(0 0 0 / 0.2); transform-origin: top left; }
  .frame > .app { position: absolute; inset: 0; }
</style>
<style>
/* Structure shared by every direction; each direction supplies tokens and character. */
.app { display: grid; overflow: hidden; outline: none; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
.app [hidden][hidden] { display: none; }
.app button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.app .ic { flex: none; display: block; }
.app mark { background: none; color: var(--accent-text, inherit); font-weight: 700; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 2px; }
.app kbd { font: 500 10.5px/1 "JetBrains Mono", monospace; padding: 2px 5px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }

.app .list { overflow: auto; min-height: 0; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.app .row { display: grid; grid-template-columns: minmax(0, 1fr) 80px 92px; align-items: center; gap: 8px; cursor: default; user-select: none; }
.app .c-name { display: flex; align-items: center; gap: 8px; min-width: 0; }
.app .c-name .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.app .c-size, .app .c-when { text-align: right; white-space: nowrap; color: var(--muted); font-size: 0.92em; }
.app .git { font: 600 10px/1 "JetBrains Mono", monospace; padding: 2px 4px; border-radius: 3px; margin-left: 2px; }
.app .git-M { color: var(--warn); background: color-mix(in oklch, var(--warn) 14%, transparent); }
.app .git-A { color: var(--ok); background: color-mix(in oklch, var(--ok) 14%, transparent); }
.app .k-folder { color: var(--folder); }
.app .k-image { color: var(--k-image, var(--muted)); }
.app .k-code { color: var(--k-code, var(--muted)); }
.app .k-archive { color: var(--k-archive, var(--muted)); }
.app .k-app { color: var(--k-app, var(--muted)); }
.app .k-doc { color: var(--muted); }

.app .crumbs { display: flex; align-items: center; gap: 2px; min-width: 0; overflow: hidden; white-space: nowrap; }
.app .crumb { padding: 2px 4px; border-radius: 4px; color: var(--muted); }
.app .crumb:last-child { color: var(--text); font-weight: 600; }
.app .crumb:hover { background: var(--hover); color: var(--text); }
.app .crumb-sep { color: var(--faint, var(--muted)); opacity: 0.7; }

.app .palette-scrim { position: absolute; inset: 0; background: var(--scrim, rgb(0 0 0 / 0.35)); z-index: 40; }
.app .palette { position: absolute; z-index: 41; top: 12%; left: 50%; width: min(680px, 80%); transform: translateX(-50%); background: var(--pal-bg, var(--surface)); color: var(--text); border-radius: var(--pal-r, 14px); box-shadow: 0 28px 80px -20px rgb(0 0 0 / 0.55), 0 0 0 1px var(--line); overflow: hidden; animation: pal-in 160ms cubic-bezier(.2,.8,.2,1); }
@keyframes pal-in { from { opacity: 0; transform: translateX(-50%) translateY(-6px) scale(0.985); } }
.app .pal-input { display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--line); color: var(--muted); }
.app .pal-input input { flex: 1; border: 0; background: none; color: var(--text); font: inherit; font-size: 17px; outline: none; }
.app .pal-list { list-style: none; margin: 0; padding: 6px; max-height: 420px; overflow: auto; }
.app .pal-item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 12px; padding: 9px 12px; border-radius: calc(var(--pal-r, 14px) - 6px); cursor: pointer; color: var(--muted); }
.app .pal-item.on { background: var(--sel-bg); color: var(--text); }
.app .pal-label { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.app .pal-detail { font: 11px "JetBrains Mono", monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 280px; }
.app .pal-type { font: 600 10px/1 "JetBrains Mono", monospace; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.7; }
.app .pal-empty { padding: 18px; color: var(--muted); }
.app .pal-foot { display: flex; gap: 14px; align-items: center; padding: 10px 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
.app .pal-scope { margin-left: auto; }

.app .term { display: grid; grid-template-rows: auto 1fr; min-height: 0; background: var(--term-bg); color: var(--term-text); }
.app .term-h { display: flex; align-items: center; gap: 8px; padding: 6px 12px; font-size: 12px; border-bottom: 1px solid var(--term-line, var(--line)); color: var(--term-muted, var(--muted)); }
.app .term-cwd { font: 12px "JetBrains Mono", monospace; color: var(--term-text); }
.app .term-follow { margin-left: auto; font-size: 11px; }
.app .term-body { margin: 0; padding: 10px 14px; font: 12.5px/1.55 "JetBrains Mono", monospace; overflow: auto; white-space: pre-wrap; }
.app .t-dim { color: var(--term-muted, var(--muted)); }
.app .t-ok { color: var(--term-ok, var(--ok)); }
.app .caret { display: inline-block; width: 8px; height: 15px; vertical-align: -3px; background: var(--term-text); opacity: 0.8; }

.app .toast { position: absolute; z-index: 45; left: 50%; bottom: 56px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 10px; background: var(--toast-bg, var(--text)); color: var(--toast-text, var(--bg)); font-size: 13px; box-shadow: 0 10px 30px -10px rgb(0 0 0 / 0.5); animation: toast-in 180ms cubic-bezier(.2,.8,.2,1); white-space: nowrap; max-width: 70%; overflow: hidden; text-overflow: ellipsis; }
@keyframes toast-in { from { opacity: 0; transform: translateX(-50%) translateY(6px); } }

.app .pv-h { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: center; padding: 14px; }
.app .pv-h span { grid-column: 2; color: var(--muted); font-size: 12px; }
.app .pv-h strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.app .pv-image { padding: 0 14px; }
.app .pv-photo { aspect-ratio: 3 / 2; border-radius: 8px; background:
  radial-gradient(120% 80% at 30% 110%, oklch(42% 0.09 150) 0 38%, transparent 39%),
  radial-gradient(90% 60% at 80% 105%, oklch(36% 0.07 160) 0 40%, transparent 41%),
  linear-gradient(180deg, oklch(78% 0.06 230), oklch(88% 0.05 70) 70%); }
.app .pv-meta { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; padding: 14px; margin: 0; font-size: 12px; }
.app .pv-meta dt { color: var(--muted); }
.app .pv-meta dd { margin: 0; }
.app .pv-code { margin: 0 14px; padding: 12px; border-radius: 8px; background: var(--code-bg, var(--hover)); font: 12px/1.55 "JetBrains Mono", monospace; overflow: auto; }
.app .pv-code .k { color: var(--k-code); }
.app .pv-code .t { color: var(--warn); }
.app .pv-folder { display: grid; gap: 6px; padding: 0 14px; font-size: 13px; }
.app .pv-folder div { display: flex; gap: 8px; align-items: center; }
.app .pv-text { padding: 0 14px; color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
  .app .palette, .app .toast { animation: none; }
}

</style>
<style>

.dir-a .bar { display: flex; align-items: center; gap: 12px; padding: 0 8px; background: var(--bar); color: var(--bar-text); }
.dir-a .wss { display: flex; gap: 4px; }

<style>

      const list = root.querySelector(".pal-list");
      const fresh = document.createElement("div");
      fresh.innerHTML = palette();
      list.replaceWith(fresh.querySelector(".pal-list"));
    });
  }

  return { icon, crumbs, rows, tabs, palette, terminal, preview, toast, bind };
})();
const DIRECTIONS = {};

</script>
<script>
/* A · Tiles: Hyprland/tmux grammar. */
DIRECTIONS.A = {
  name: "Tiles",
  className: "dir-a",
  render(root, opts = {}) {
    const s = FM.state;
    const ws = FM.ws();

<script>
/* B · Commander: Total Commander's heir. Resizable rail, tab path tools, and a drawer of add/remove views. */
const BSTATE = (() => {
  const saved = (() => {
    try { return JSON.parse(localStorage.getItem("fm-b") || "{}"); } catch { return {}; }
  })();
  return {
    rail: { w: saved.w ?? 236, collapsed: saved.collapsed ?? false, locked: saved.locked ?? false },
    drawer: { open: saved.open ?? true, h: saved.h ?? 220, views: saved.views ?? ["transfers", "clipboard", "search"], active: saved.active ?? "transfers" },
    menu: null,
    dragging: null,
  };
})();
const RAIL = { min: 160, max: 420, icons: 56, reset: 236 };
const DRAWER = { min: 120, max: 420 };

function saveB() {
  const { rail, drawer } = BSTATE;
  try { localStorage.setItem("fm-b", JSON.stringify({ ...rail, open: drawer.open, h: drawer.h, views: drawer.views, active: drawer.active })); } catch {}
}

function ensureBViews() {
  if (DOCK.views.compare) return;
  DOCK.views.compare = {
    label: "Compare", icon: "split",
    render() {
      const panes = FM.ws().panes;
      if (panes.length < 2) return `<p class="dv-empty">Open a second panel to compare.</p>`;
      const a = panes[0].tabs[panes[0].active].path;
      const b = panes[1].tabs[panes[1].active].path;
      const left = new Map(FM.list(a).map((e) => [e.name, e]));
      const right = new Map(FM.list(b).map((e) => [e.name, e]));
      const names = [...new Set([...left.keys(), ...right.keys()])].slice(0, 12);
      const row = (n) => {
        const l = left.get(n);
        const r = right.get(n);
        const state = l && r ? (l.size === r.size ? "same" : "diff") : l ? "left" : "right";
        const label = { same: "same", diff: "differs", left: "only left", right: "only right" }[state];
        return `<div class="cmp ${state}"><span>${l ? FM.esc(n) : ""}</span><em>${label}</em><span>${r ? FM.esc(n) : ""}</span></div>`;
      };
      return `<div class="dv-cmp"><div class="cmp-h"><b>${FM.esc(FM.base(a))}</b><span>${names.filter((n) => !(left.has(n) && right.has(n))).length} differences</span><b>${FM.esc(FM.base(b))}</b></div><div class="dv-list">${names.map(row).join("")}</div><div class="cmp-acts"><button>Sync left → right</button><button>Sync both ways</button></div></div>`;
    },
  };
  DOCK.views.selection = {
    label: "Selection", icon: "check",
    badge: () => FM.current().marked.size || null,
    render() {
      const t = FM.current();
      const entries = FM.list(t.path);
      const marked = [...t.marked].map((i) => entries[i]).filter(Boolean);
      if (!marked.length) return `<p class="dv-empty">Mark files with <kbd>Space</kbd> or <kbd>Insert</kbd> to act on several at once.</p>`;
      const size = marked.reduce((a, e) => a + (e.size ?? 0), 0);
      return `<div class="dv-sel"><div class="sel-h"><b>${marked.length} marked</b><span>${FM.fmtSize(size)} · ${FM.esc(t.path)}</span></div>
        <div class="sel-files">${marked.map((e) => `<span>${UI.icon(FM.kindOf(e), 13)}${FM.esc(e.name)}</span>`).join("")}</div>
        <div class="cmp-acts"><button>Copy paths</button><button>Copy to other panel</button><button>Batch rename…</button><button>Zip</button><button>Delete</button></div></div>`;
    },
  };
}

const B_ALL = ["transfers", "clipboard", "search", "compare", "selection", "git", "notes", "disk", "activity", "preview", "terminal"];

function bTabs(pi) {
  const p = FM.ws().panes[pi];
  return `<div class="tabs" role="tablist">${p.tabs
    .map((t, ti) => `<button class="tab ${ti === p.active ? "on" : ""}" role="tab" aria-selected="${ti === p.active}" data-tab="${ti}" data-pane="${pi}" title="${FM.esc(t.path)}">${UI.icon("folder", 13)}<span>${FM.esc(FM.base(t.path))}</span><span class="tab-copy" data-b="tabcopy:${pi}:${ti}" title="Copy path">${UI.icon("copy", 11)}</span>${p.tabs.length > 1 ? `<span class="tab-x" data-closetab="${ti}" data-pane="${pi}">${UI.icon("close", 11)}</span>` : ""}</button>`)
    .join("")}<button class="tab-add" data-b="newmenu:${pi}" aria-label="New tab" aria-haspopup="menu">${UI.icon("plus", 13)}</button></div>`;
}

function bMenu() {
  const m = BSTATE.menu;
  if (!m || m.type === "add") return "";
  const item = (act, icon, label, hint = "") => `<button role="menuitem" data-b="${act}">${UI.icon(icon, 14)}<span>${label}</span>${hint ? `<em>${hint}</em>` : ""}</button>`;
  const pos = `left:${m.x}px;top:${m.y}px`;
  if (m.type === "tab") {
    const t = FM.ws().panes[m.pane].tabs[m.tab];
    return `<div class="bmenu" role="menu" style="${pos}">
      <div class="bm-h">${FM.esc(t.path)}</div>
      ${item(`copy:${m.pane}:${m.tab}:windows`, "copy", "Copy path", "Ctrl+Shift+C")}
      ${item(`copy:${m.pane}:${m.tab}:wsl`, "terminal", "Copy as WSL path", FM.esc(FM.variant(t.path, "wsl")))}
      ${item(`copy:${m.pane}:${m.tab}:quoted`, "copy", "Copy quoted")}
      ${item(`copy:${m.pane}:${m.tab}:url`, "copy", "Copy as file URL")}
      ${item(`copyall:${m.pane}`, "layers", "Copy all tab paths in this panel")}
      <hr>
      ${item(`dup:${m.pane}:${m.tab}`, "plus", "Duplicate tab")}
      ${item(`other:${m.pane}:${m.tab}`, "split", "Open in the other panel")}
      ${item(`close:${m.pane}:${m.tab}`, "close", "Close tab", "Ctrl+W")}
    </div>`;
  }
  const clip = FM.state.clip;
  return `<div class="bmenu" role="menu" style="${pos}">
    ${item(`newhere:${m.pane}`, "plus", "New tab here", "Ctrl+T")}
    ${clip ? item(`newclip:${m.pane}`, "copy", "New tab from clipboard", FM.esc(clip)) : ""}
    <div class="bm-h">Recent</div>
    ${FM.state.recent.map((r, i) => item(`newrecent:${m.pane}:${i}`, "folder", FM.esc(FM.base(r)), FM.esc(FM.parent(r)))).join("")}
    <hr>
    <label class="bm-input">${UI.icon("chevron", 13)}<input id="bPathInput" placeholder="Type or paste a path, Enter opens it" spellcheck="false"></label>
  </div>`;
}

function bDrawer() {
  const d = BSTATE.drawer;
  if (!d.open) return "";
  const free = B_ALL.filter((v) => !d.views.includes(v));
  return `<section class="drawer" aria-label="Drawer">
    <div class="drawer-grip" data-grip="drawer" tabindex="0" role="separator" aria-orientation="horizontal" aria-valuenow="${d.h}" aria-label="Drawer height"></div>
    <header class="dw-h">
      <div class="dw-tabs" role="tablist">${d.views.map((v) => {
        const view = DOCK.views[v];
        const badge = view.badge?.();
        return `<span class="dw-tab ${v === d.active ? "on" : ""}"><button role="tab" aria-selected="${v === d.active}" data-b="view:${v}">${UI.icon(view.icon, 13)}${view.label}${badge ? `<b>${badge}</b>` : ""}</button>${d.views.length > 1 ? `<button class="dw-x" data-b="remove:${v}" aria-label="Remove ${view.label}">${UI.icon("close", 10)}</button>` : ""}</span>`;
      }).join("")}
        <button class="dw-add" data-b="addmenu" aria-label="Add a view" aria-haspopup="menu">${UI.icon("plus", 13)}</button>
      </div>
      <button class="dw-close" data-b="drawer" title="Hide drawer (F9)">${UI.icon("close", 13)}</button>
    </header>
    <div class="dw-body">${DOCK.render(d.active)}</div>
    ${BSTATE.menu?.type === "add" ? `<div class="bmenu add" role="menu">${free.map((v) => `<button role="menuitem" data-b="add:${v}">${UI.icon(DOCK.views[v].icon, 14)}<span>${DOCK.views[v].label}</span></button>`).join("") || "<p>Everything is already here.</p>"}</div>` : ""}
  </section>`;
}

function bRail() {
  const s = FM.state;
  const r = BSTATE.rail;
  const head = (label) => (r.collapsed ? `<hr>` : `<h2>${label}</h2>`);
  return `<aside class="rail ${r.collapsed ? "icons" : ""}" aria-label="Sidebar">
    <div class="rail-top">
      ${r.collapsed ? "" : `<span>Navigator</span>`}
      <button data-b="lock" class="${r.locked ? "on" : ""}" title="${r.locked ? "Width locked · click to unlock" : "Lock this width"}">${UI.icon("pin", 14)}</button>
      <button data-b="collapse" title="${r.collapsed ? "Expand sidebar" : "Collapse to icons"}">${UI.icon("chevron", 14, r.collapsed ? "" : "flip")}</button>
    </div>
    ${head("Pinned")}
    ${FM.pins.map((p) => `<button class="rail-i" data-go="${FM.esc(p.path)}" title="${FM.esc(p.label)} · Ctrl+${p.key}">${UI.icon(p.path.startsWith("\\\\") ? "cloud" : "pin", 15)}<span>${FM.esc(p.label)}</span><kbd>${p.key}</kbd></button>`).join("")}
    ${head("Sets")}
    ${FM.workspaces.slice(0, 3).map((w, i) => `<button class="rail-i set ${i === s.ws ? "on" : ""}" data-ws="${i}" title="${FM.esc(w.name)} · Alt+${w.key}"><span class="glyph g${w.panes.length}">${"<i></i>".repeat(w.panes.length)}</span><span>${FM.esc(w.name)}</span><kbd>Alt ${w.key}</kbd></button>`).join("")}
    ${head("Drives")}
    ${FM.drives.map((d) => `<button class="rail-i drive-i" data-go="${FM.esc(d.path)}" title="${FM.esc(d.label)} · ${Math.round((1 - d.used) * 100)}% free">${UI.icon(d.path.startsWith("\\\\") ? "cloud" : "drive", 15)}<span>${FM.esc(d.label)}<small><i style="width:${d.used * 100}%"></i></small></span><em>${d.size}</em></button>`).join("")}
    <div class="rail-grip ${r.locked ? "locked" : ""}" data-grip="rail" tabindex="0" role="separator" aria-orientation="vertical" aria-valuemin="${RAIL.min}" aria-valuemax="${RAIL.max}" aria-valuenow="${r.collapsed ? RAIL.icons : r.w}" aria-label="Sidebar width"></div>
    ${BSTATE.dragging === "rail" ? `<span class="wbadge">${r.collapsed ? "icons" : `${r.w} px`}</span>` : ""}
  </aside>`;
}

DIRECTIONS.B = {
  name: "Commander",
  className: "dir-b",
  onMount(root) {
    ensureBViews();
    FM.state.terminal = false;
    root.addEventListener("click", onBClick);
    root.addEventListener("contextmenu", (e) => {
      const tab = e.target.closest(".tab[data-tab]");
      if (!tab) return;
      e.preventDefault();
      const box = root.getBoundingClientRect();
      BSTATE.menu = { type: "tab", pane: Number(tab.dataset.pane), tab: Number(tab.dataset.tab), x: Math.min(e.clientX - box.left, box.width - 320), y: e.clientY - box.top + 4 };
      FM.emit();
    });
    root.addEventListener("pointerdown", (e) => startDrag(e, root));
    root.addEventListener("keydown", (e) => {
      const grip = e.target.closest?.("[data-grip]");
      if (e.key === "Escape" && BSTATE.menu) { BSTATE.menu = null; FM.emit(); e.stopPropagation(); return; }
      if (e.key === "F9") { BSTATE.drawer.open = !BSTATE.drawer.open; saveB(); FM.emit(); e.preventDefault(); e.stopPropagation(); return; }
      if (e.target.id === "bPathInput" && e.key === "Enter") { openTab(BSTATE.menu.pane, e.target.value.trim() || FM.state.clip); e.stopPropagation(); return; }
      if (!grip) return;
      const step = e.shiftKey ? 48 : 16;
      if (grip.dataset.grip === "rail" && !BSTATE.rail.locked) {
        if (e.key === "ArrowLeft") setRail(BSTATE.rail.w - step);
        else if (e.key === "ArrowRight") setRail((BSTATE.rail.collapsed ? RAIL.min : BSTATE.rail.w) + step, true);
        else if (e.key === "Enter") BSTATE.rail.collapsed = !BSTATE.rail.collapsed;
        else return;
      } else if (grip.dataset.grip === "drawer") {
        if (e.key === "ArrowUp") BSTATE.drawer.h = Math.min(DRAWER.max, BSTATE.drawer.h + step);
        else if (e.key === "ArrowDown") BSTATE.drawer.h = Math.max(DRAWER.min, BSTATE.drawer.h - step);
        else return;
      } else return;
      e.preventDefault();
      e.stopPropagation();
      saveB();
      FM.emit();
      root.querySelector(`[data-grip="${grip.dataset.grip}"]`)?.focus();
    }, true);
    root.addEventListener("dblclick", (e) => {
      if (e.target.closest('[data-grip="rail"]') && !BSTATE.rail.locked) { BSTATE.rail = { ...BSTATE.rail, w: RAIL.reset, collapsed: false }; saveB(); FM.emit(); }
    });
  },
  render(root) {
    const s = FM.state;
    const ws = FM.ws();
    const t = FM.current();
    const r = BSTATE.rail;
    root.style.setProperty("--rail-w", `${r.collapsed ? RAIL.icons : r.w}px`);
    root.style.setProperty("--drawer-h", `${BSTATE.drawer.h}px`);
    root.classList.toggle("is-dragging", Boolean(BSTATE.dragging));
    const ext = (e) => (e.dir || !e.name.includes(".") ? "" : e.name.split(".").pop());
    const stem = (e) => (e.dir || !e.name.includes(".") ? e.name : e.name.slice(0, e.name.lastIndexOf(".")));
    const panes = ws.panes
      .map((p, pi) => {
        const tab = p.tabs[p.active];
        const entries = FM.list(tab.path);
        const files = entries.filter((e) => !e.dir);
        const total = files.reduce((a, e) => a + e.size, 0);
        const marked = [...tab.marked].map((i) => entries[i]).filter(Boolean);
        const rows = entries
          .map((e, i) => `<div class="row ${i === tab.sel ? "sel" : ""} ${tab.marked.has(i) ? "marked" : ""} ${e.dir ? "dir" : ""} ${i % 2 ? "odd" : ""}" data-pane="${pi}" data-row="${i}" role="row" aria-selected="${i === tab.sel}">
              <span class="c-name">${UI.icon(FM.kindOf(e), 15, `k-${FM.kindOf(e)}`)}<span class="nm">${e.dir ? `[${FM.esc(e.name)}]` : FM.esc(stem(e))}</span>${e.git ? `<span class="git git-${e.git}">${e.git}</span>` : ""}</span>
              <span class="c-ext">${FM.esc(ext(e))}</span>
              <span class="c-size">${e.dir ? "&lt;DIR&gt;" : FM.fmtSize(e.size)}</span>
              <span class="c-when">${e.when.toLocaleDateString("en-GB", { day: "2-digit", month: "2-digit", year: "2-digit" })} ${e.when.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" })}</span>
            </div>`)
          .join("");
        return `<section class="pane ${pi === s.focus ? "active" : ""}" data-pane="${pi}" aria-label="Panel ${pi + 1}">
          ${bTabs(pi)}
          <div class="pathbar"><span class="drive">${FM.esc(tab.path.startsWith("\\\\") ? "\\\\nas" : tab.path.slice(0, 2))}</span>${UI.crumbs(pi, tab.path)}<button class="ghost" data-b="tabcopy:${pi}:${p.active}" title="Copy path">${UI.icon("copy", 14)}</button></div>
          <div class="heads"><span>Name</span><span>Ext</span><span>Size</span><span>Date</span></div>
          <div class="list" role="grid">${rows}</div>
          <footer class="pane-f">${marked.length ? `<b>${marked.length}</b> of ${entries.length} marked · ${FM.fmtSize(marked.reduce((a, e) => a + (e.size ?? 0), 0))}` : `${files.length} files, ${entries.length - files.length} folders · ${FM.fmtSize(total)}`}</footer>
        </section>`;
      })
      .join("");
    const fkeys = [["F2", "Rename"], ["F3", "View"], ["F4", "Edit"], ["F5", "Copy"], ["F6", "Move"], ["F7", "New folder"], ["F8", "Delete"], ["F9", "Drawer"], ["F10", "Palette"]];
    root.innerHTML = `
      <header class="top" data-tauri-drag-region>
        <div class="brand">${UI.icon("layers", 18)}<b>Commander</b></div>
        <div class="tools">
          <button data-act="split" title="Split (Ctrl+\\)">${UI.icon("split", 16)}</button>
          <button data-b="drawer" class="${BSTATE.drawer.open ? "on" : ""}" title="Drawer (F9)">${UI.icon("layers", 16)}</button>
        </div>
        <button class="search" data-act="palette">${UI.icon("search", 15)}<span>Find anywhere: files, folders, commands</span><kbd>Ctrl K</kbd></button>
        <div class="winctl"><span></span><span></span><span></span></div>
      </header>
      ${bRail()}
      <main class="panes n${ws.panes.length}">${panes}</main>
      ${bDrawer()}
      <div class="cmdline"><span class="prompt">${FM.esc(t.path)}&gt;</span><span class="cmd-ph">type a command, or ! for PowerShell</span></div>
      <nav class="fkeys">${fkeys.map(([k, l]) => `<button ${k === "F9" ? 'data-b="drawer"' : ""}><kbd>${k}</kbd>${l}</button>`).join("")}</nav>
      ${bMenu()}${UI.palette()}${UI.toast()}`;
    const input = root.querySelector("#bPathInput");
    if (input && BSTATE.menu?.focusInput) input.focus();
  },
};

function setRail(w, expand = false) {
  const r = BSTATE.rail;
  if (w < RAIL.min - 40) { r.collapsed = true; return; }
  if (expand || w >= RAIL.min) r.collapsed = false;
  r.w = Math.max(RAIL.min, Math.min(RAIL.max, Math.round(w)));
}

function openTab(pi, path) {
  const p = FM.ws().panes[pi];
  p.tabs.push(FM.tab(path));
  p.active = p.tabs.length - 1;
  FM.state.focus = pi;
  BSTATE.menu = null;
  FM.toast(`New tab · ${path}`);
  FM.emit();
}

function onBClick(e) {
  const el = e.target.closest("[data-b]");
  if (!el) {
    if (BSTATE.menu && !e.target.closest(".bmenu")) { BSTATE.menu = null; FM.emit(); }
    return;
  }
  e.stopPropagation();
  const [cmd, a, b, c] = el.dataset.b.split(":");
  const box = e.currentTarget.getBoundingClientRect();
  const tabPath = (pi, ti) => FM.ws().panes[Number(pi)].tabs[Number(ti)].path;
  const d = BSTATE.drawer;
  if (cmd === "tabcopy") FM.copy(tabPath(a, b));
  if (cmd === "copy") FM.copy(FM.variant(tabPath(a, b), c));
  if (cmd === "copyall") FM.copy(FM.ws().panes[Number(a)].tabs.map((t) => t.path).join("\n"), `Copied ${FM.ws().panes[Number(a)].tabs.length} paths ·`);
  if (cmd === "dup") return openTab(Number(a), tabPath(a, b));
  if (cmd === "other") return openTab((Number(a) + 1) % FM.ws().panes.length, tabPath(a, b));
  if (cmd === "close") FM.actions.closeTab(Number(a), Number(b));
  if (cmd === "newmenu") {
    const r = el.getBoundingClientRect();
    BSTATE.menu = { type: "new", focusInput: true, pane: Number(a), x: Math.min(r.left - box.left, box.width - 340), y: r.bottom - box.top + 4 };
    FM.emit();
    return;
  }
  if (cmd === "newhere") return openTab(Number(a), FM.current(FM.ws().panes[Number(a)]).path);
  if (cmd === "newclip") return openTab(Number(a), FM.state.clip);
  if (cmd === "newrecent") return openTab(Number(a), FM.state.recent[Number(b)]);
  if (cmd === "lock") BSTATE.rail.locked = !BSTATE.rail.locked;
  if (cmd === "collapse") BSTATE.rail.collapsed = !BSTATE.rail.collapsed;
  if (cmd === "drawer") d.open = !d.open;
  if (cmd === "view") d.active = a;
  if (cmd === "remove") { d.views = d.views.filter((v) => v !== a); if (d.active === a) d.active = d.views[0]; }
  if (cmd === "addmenu") { BSTATE.menu = BSTATE.menu?.type === "add" ? null : { type: "add" }; saveB(); FM.emit(); return; }
  if (cmd === "add") { d.views.push(a); d.active = a; BSTATE.menu = null; }
  BSTATE.menu = null;
  saveB();
  FM.emit();
}

function startDrag(e, root) {
  const grip = e.target.closest("[data-grip]");
  if (!grip || e.button !== 0) return;
  const kind = grip.dataset.grip;
  if (kind === "rail" && BSTATE.rail.locked) return;
  e.preventDefault();
  const box = root.getBoundingClientRect();
  const scale = box.width / root.offsetWidth;
  const startY = e.clientY;
  const startH = BSTATE.drawer.h;
  BSTATE.dragging = kind;
  FM.emit();
  const move = (ev) => {
    if (kind === "rail") {
      setRail((ev.clientX - box.left) / scale);
      root.style.setProperty("--rail-w", `${BSTATE.rail.collapsed ? RAIL.icons : BSTATE.rail.w}px`);
      const badge = root.querySelector(".wbadge");
      if (badge) badge.textContent = BSTATE.rail.collapsed ? "icons" : `${BSTATE.rail.w} px`;
      root.querySelector(".rail")?.classList.toggle("icons", BSTATE.rail.collapsed);
    } else {
      BSTATE.drawer.h = Math.max(DRAWER.min, Math.min(DRAWER.max, startH + (startY - ev.clientY) / scale));
      root.style.setProperty("--drawer-h", `${BSTATE.drawer.h}px`);
    }
  };
  const up = () => {
    window.removeEventListener("pointermove", move);
    window.removeEventListener("pointerup", up);
    BSTATE.dragging = null;
    saveB();
    FM.emit();
  };
  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", up);
}

</script>

<script>
/* I–L: calm by default, add what you need, designed for a laptop-sized window first. */
FM.workspaces.push({ name: "Everyday", key: 4, panes: [{ tabs: [{ path: "C:\\Users\\admin\\Downloads", sel: 0, marked: new Set() }], active: 0 }, { tabs: [{ path: "D:\\work\\commander", sel: 0, marked: new Set() }], active: 0 }] });
const CALM_WS = FM.workspaces.length - 1;
FM.state.calm = { views: ["terminal", "transfers"], active: "terminal", addOpen: false, sections: { transfers: true, terminal: true, clipboard: false }, rail: false };

const CALM = (() => {
  const ic = UI.icon;
  const esc = FM.esc;
  const ALL = ["terminal", "transfers", "search", "git", "clipboard", "notes", "disk", "activity", "preview"];

  function onMount() {
    FM.state.ws = CALM_WS;
    FM.state.focus = 0;
    FM.state.terminal = false;
    FM.state.palette.open = false;
  }

  function wsMenu() {
    const s = FM.state;
    return `<div class="ws-switch" role="group" aria-label="Workspace">${FM.workspaces
      .map((w, i) => `<button class="${i === s.ws ? "on" : ""}" data-ws="${i}" title="${esc(w.name)} · Alt+${i + 1}"><span class="full">${esc(w.name)}</span><span class="short">${i + 1}</span></button>`)
      .join("")}</div>`;
  }

  function pane(pi, opts = {}) {
    const s = FM.state;
    const p = FM.ws().panes[pi];
    const t = p.tabs[p.active];
    const entries = FM.list(t.path);
    const rows = entries
      .map((e, i) => {
        const kind = FM.kindOf(e);
        return `<div class="row ${i === t.sel ? "sel" : ""} ${t.marked.has(i) ? "marked" : ""} ${e.dir ? "dir" : ""}" data-pane="${pi}" data-row="${i}" role="row" aria-selected="${i === t.sel}">
          <span class="c-name">${ic(kind, 16, `k-${kind}`)}<span class="nm">${esc(e.name)}</span>${e.git ? `<span class="git git-${e.git}">${e.git}</span>` : ""}</span>
          <span class="c-size">${e.dir ? "" : FM.fmtSize(e.size)}</span>
          <span class="c-when">${FM.fmtWhen(e.when)}</span>
        </div>`;
      })
      .join("");
    const tabs = p.tabs.length > 1 ? `<div class="ptabs">${p.tabs.map((x, ti) => `<button class="${ti === p.active ? "on" : ""}" data-tab="${ti}" data-pane="${pi}">${esc(FM.base(x.path))}</button>`).join("")}</div>` : "";
    const closable = FM.ws().panes.length > 1;
    return `<section class="pane ${pi === s.focus ? "active" : ""}" data-pane="${pi}" aria-label="${esc(FM.base(t.path))}">
      <header class="ph">
        ${UI.crumbs(pi, t.path)}
        <span class="ph-acts">
          <button data-act="copyPath" title="Copy path (Ctrl+Shift+C)">${ic("copy", 14)}</button>
          ${closable ? `<button data-calm="close:${pi}" title="Close pane">${ic("close", 14)}</button>` : ""}
        </span>
      </header>
      ${tabs}
      <div class="list" role="grid">${rows}</div>
      ${t.marked.size ? `<footer class="pf">${t.marked.size} selected · <button data-cmd="Copy to other pane">Copy</button> <button>Move</button> <button>Delete</button></footer>` : ""}
      ${opts.extra ?? ""}
    </section>`;
  }

  function addMenu(where) {
    const c = FM.state.calm;
    if (!c.addOpen) return "";
    const free = ALL.filter((v) => !c.views.includes(v));
    return `<div class="addmenu ${where}" role="menu">${free.length ? free.map((v) => `<button role="menuitem" data-calm="add:${v}">${ic(DOCK.views[v].icon, 15)}<span>${DOCK.views[v].label}</span></button>`).join("") : `<p>Everything is already in the dock.</p>`}</div>`;
  }

  function viewSwitch() {
    const c = FM.state.calm;
    return `<div class="vswitch" role="tablist">${c.views
      .map((v) => `<span class="vchip ${v === c.active ? "on" : ""}"><button role="tab" aria-selected="${v === c.active}" data-calm="view:${v}">${ic(DOCK.views[v].icon, 14)}${DOCK.views[v].label}${DOCK.views[v].badge?.() ? `<b>${DOCK.views[v].badge()}</b>` : ""}</button>${c.views.length > 1 ? `<button class="vx" data-calm="remove:${v}" aria-label="Remove ${DOCK.views[v].label}">${ic("close", 11)}</button>` : ""}</span>`)
      .join("")}<button class="vadd ${c.addOpen ? "on" : ""}" data-calm="addmenu" aria-label="Add a view">${ic("plus", 14)}</button></div>`;
  }

  function dock(opts = {}) {
    const c = FM.state.calm;
    if (!FM.state.terminal) return "";
    const second = opts.split && c.views.length > 1 ? c.views.find((v) => v !== c.active) : null;
    return `<section class="dock ${second ? "two" : ""}" aria-label="Dock">
      <header class="dh">${viewSwitch()}<button class="dclose" data-act="terminal" title="Hide dock (Ctrl+\`)">${ic("close", 14)}</button></header>
      <div class="db">${second ? `<div class="db-a">${DOCK.render(c.active)}</div><div class="db-b"><span class="db-label">${DOCK.views[second].label}</span>${DOCK.render(second)}</div>` : DOCK.render(c.active)}</div>
      ${addMenu("up")}
    </section>`;
  }

  function topbar(extra = "") {
    return `<header class="tb" data-tauri-drag-region>
      ${wsMenu()}
      <button class="find" data-act="palette">${ic("search", 15)}<span>Search</span><kbd>Ctrl K</kbd></button>
      <span class="tb-acts">${extra}
        <button data-act="split" title="Add pane (Ctrl+\\)">${ic("split", 16)}</button>
        <button data-act="terminal" class="${FM.state.terminal ? "on" : ""}" title="Dock (Ctrl+\`)">${ic("terminal", 16)}</button>
        <span class="wc"><i></i><i></i><i></i></span>
      </span>
    </header>`;
  }

  const overlays = () => `${UI.palette()}${UI.toast()}`;

  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-calm]");
    const c = FM.state.calm;
    if (!el) {
      if (c.addOpen && !e.target.closest(".addmenu")) { c.addOpen = false; FM.emit(); }
      return;
    }
    const [cmd, arg] = el.dataset.calm.split(":");
    if (cmd === "view") c.active = arg;
    if (cmd === "addmenu") { c.addOpen = !c.addOpen; FM.emit(); return; }
    if (cmd === "add") { c.views.push(arg); c.active = arg; c.sections[arg] = true; c.addOpen = false; FM.state.terminal = true; }
    if (cmd === "remove") { c.views = c.views.filter((v) => v !== arg); if (c.active === arg) c.active = c.views[0]; }
    if (cmd === "close") { const ws = FM.ws(); ws.panes.splice(Number(arg), 1); FM.state.focus = Math.min(FM.state.focus, ws.panes.length - 1); }
    if (cmd === "stack") FM.state.focus = Number(arg);
    if (cmd === "section") c.sections[arg] = !c.sections[arg];
    if (cmd === "rail") c.rail = !c.rail;
    FM.emit();
  });

  return { onMount, pane, dock, topbar, viewSwitch, addMenu, overlays, ALL };
})();

DIRECTIONS.I = {
  name: "Calm tiles",
  className: "calm dir-i",
  onMount: CALM.onMount,
  render(root) {
    const n = FM.ws().panes.length;

};

    root.innerHTML = `${CALM.topbar()}

        <h2>Pinned</h2>${FM.pins.slice(0, 4).map((p) => `<button class="pinl" data-go="${FM.esc(p.path)}">${UI.icon("pin", 14)}<span>${FM.esc(p.label)}</span></button>`).join("")}</aside>
      <main class="work n${shown.length}">${shown.map((pi) => CALM.pane(pi)).join("")}</main>
      ${CALM.dock()}${CALM.overlays()}`;
  },
};

DIRECTIONS.L = {
  name: "Side dock",
  className: "calm dir-l",
  onMount() {
    CALM.onMount();
    FM.state.terminal = true;
  },
  render(root) {
    const s = FM.state;

    const n = FM.ws().panes.length;
    const side = s.terminal

        ? `<aside class="rail" aria-label="Dock">${c.views.map((v) => `<button data-calm="rail" title="${DOCK.views[v].label}">${UI.icon(DOCK.views[v].icon, 18)}${DOCK.views[v].badge?.() ? `<b>${DOCK.views[v].badge()}</b>` : ""}</button>`).join("")}<button data-calm="rail" class="exp" title="Expand">${UI.icon("chevron", 16)}</button></aside>`
        : `<aside class="side" aria-label="Dock">
            <header class="sh"><b>Dock</b><span class="sp"></span><button data-calm="addmenu" class="${c.addOpen ? "on" : ""}" title="Add a view">${UI.icon("plus", 15)}</button><button data-calm="rail" title="Collapse to icons">${UI.icon("chevron", 15)}</button></header>
            ${CALM.addMenu("down")}
            <div class="sections">${c.views
              .map((v) => `<section class="sec ${c.sections[v] ? "open" : ""}">
                <header><button class="sec-t" data-calm="section:${v}">${UI.icon("chevron", 13, "chev")}${UI.icon(DOCK.views[v].icon, 14)}${DOCK.views[v].label}${DOCK.views[v].badge?.() ? `<b>${DOCK.views[v].badge()}</b>` : ""}</button><button class="vx" data-calm="remove:${v}" aria-label="Remove ${DOCK.views[v].label}">${UI.icon("close", 11)}</button></header>
                ${c.sections[v] ? `<div class="sec-b">${DOCK.render(v)}</div>` : ""}
              </section>`)
              .join("")}</div>
          </aside>`
      : "";
    root.innerHTML = `${CALM.topbar()}
      <div class="body ${s.terminal ? (c.rail ? "with-rail" : "with-side") : ""}"><main class="work n${n}">${FM.ws().panes.map((_, pi) => CALM.pane(pi)).join("")}</main>${side}</div>
      ${CALM.overlays()}`;
  },
};

</script>
<script>
  const params = new URLSearchParams(location.search);
  let prefs = {};
  try { prefs = JSON.parse(localStorage.getItem("fm-picker") || "{}"); } catch {}
  const cur = { dir: prefs.dir || "B", size: prefs.size || "1440x900", theme: params.get("theme") || prefs.theme || "auto" };
  if (params.get("ws")) FM.state.ws = Number(params.get("ws"));
  if (params.get("palette")) { FM.state.palette = { open: true, query: params.get("palette"), sel: 0 }; }
  const frame = document.getElementById("frame");
  let root = null;
  function fit() {
    const [w, h] = cur.size.split("x").map(Number);
    frame.style.width = `${w}px`;
    frame.style.height = `${h}px`;
    const scale = Math.min(1, (document.documentElement.clientWidth - 32) / w);
    frame.style.transform = scale < 1 ? `scale(${scale})` : "";
    const fitBox = document.getElementById("fit");
    fitBox.style.width = `${w * scale}px`;
    fitBox.style.height = `${h * scale}px`;
  }
  function draw() {
    if (!root) return;
    DIRECTIONS[cur.dir].render(root);
    const input = root.querySelector("#palInput");
    if (input && document.activeElement !== input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
    if (!FM.state.palette.open && !root.contains(document.activeElement)) root.focus({ preventScroll: true });
  }
  function mount() {
    frame.innerHTML = "";
    root = document.createElement("div");
    root.className = `app ${DIRECTIONS[cur.dir].className}`;
    root.tabIndex = -1;
    const viewerTheme = document.documentElement.dataset.theme;
    if (cur.theme !== "auto") root.dataset.theme = cur.theme;
    else if (viewerTheme) root.dataset.theme = viewerTheme;
    frame.append(root);
    DIRECTIONS[cur.dir].onMount?.(root);
    UI.bind(root);
    root.addEventListener("keydown", FM.onKey);
    draw();
  }
  function apply() {
    for (const b of document.querySelectorAll("[data-dir]")) b.setAttribute("aria-pressed", String(b.dataset.dir === cur.dir));
    for (const b of document.querySelectorAll("[data-size]")) b.setAttribute("aria-pressed", String(b.dataset.size === cur.size));
    for (const b of document.querySelectorAll("[data-theme-choice]")) b.setAttribute("aria-pressed", String(b.dataset.themeChoice === cur.theme));
    try { localStorage.setItem("fm-picker", JSON.stringify(cur)); } catch {}
    fit();
  }
  document.querySelector(".harness").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.dir) cur.dir = b.dataset.dir;
    if (b.dataset.size) cur.size = b.dataset.size;
    if (b.dataset.themeChoice) cur.theme = b.dataset.themeChoice;
    apply();
    mount();
  });
  window.addEventListener("resize", fit);
  FM.subscribe(draw);
  apply();
  mount();
</script>
