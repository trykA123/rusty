[package]
name = "gpui-b"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
env_logger = "0.11.11"
gpui-kit = "=0.7.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[profile.release]
strip = true

[dev-dependencies]
gpui-kit = { version = "=0.7.3", features = ["test-support"] }
