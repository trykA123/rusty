name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  PDFIUM_TAG: chromium/8076
  PDFIUM_SHA256: 808d36da9bc5a3104315fb307c80998121f565ee53953633bf33e80d7429e5ac

jobs:
  gate-linux:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@fb523f40495206854c36b250850817ae0f83e3d1 # 1.99.0
        with:
          components: rustfmt, clippy, llvm-tools
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev libvulkan-dev libasound2-dev libzstd-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest@0.9.148,cargo-llvm-cov@0.9.1,cargo-deny@0.20.2,cargo-audit@0.22.2,typos@1.51.1,taplo@0.10.0
      - run: cargo xtask gate --coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-linux
          path: target/nextest/ci/junit.xml

  clippy-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@fb523f40495206854c36b250850817ae0f83e3d1 # 1.99.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets -- -D warnings

  gate-windows:
    runs-on: windows-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      NAVO_EXPECT_PDFIUM: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@fb523f40495206854c36b250850817ae0f83e3d1 # 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest@0.9.148
      - name: Put pdfium.dll next to the test build of navo.exe
        shell: pwsh
        run: ./.github/scripts/fetch-pdfium.ps1 -Destination target/debug
      - run: cargo nextest run --workspace --profile ci
      - run: cargo test -p gpui-pre-windows --lib
      - run: cargo test --workspace --doc
      - name: Copy benchmark (informational)
        continue-on-error: true
        timeout-minutes: 10
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'navo-copy-bench'
          $table = cargo xtask bench-copy $target --sets 'small,medium' --runs 1
          $benchmarkExit = $LASTEXITCODE
          $table | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($benchmarkExit -ne 0) { exit $benchmarkExit }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-windows
          path: target/nextest/ci/junit.xml

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@fb523f40495206854c36b250850817ae0f83e3d1 # 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --release -p rusty-app
      - run: cargo build --release --locked -p xtask
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: navo-bench-tools-windows
          path: target/release/xtask.exe
          if-no-files-found: error
      - name: Probe Windows UI Automation names (Red phase)
        continue-on-error: true
        timeout-minutes: 3
        shell: powershell
        run: ./scripts/uia-probe.ps1 -Exe target/release/navo.exe -DumpPath "${{ runner.temp }}/navo-uia-dump.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: navo-uia-windows-${{ github.sha }}
          path: ${{ runner.temp }}/navo-uia-dump.txt
          if-no-files-found: warn
      - name: Binary size
        run: cargo xtask binsize target/release/navo.exe
      - shell: pwsh
        run: |
          $out = (& target/release/navo.exe --version | Out-String).Trim()
          if ($out -ne 'navo 0.0.1') { throw "unexpected output: $out" }
      - name: Stage navo.exe with its PDB, pdfium.dll and licences
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -LiteralPath target/release/navo.exe -Destination dist
          Copy-Item -LiteralPath target/release/navo.pdb -Destination dist
          ./.github/scripts/fetch-pdfium.ps1 -Destination dist -Licenses dist/licenses/pdfium
      - name: Verify release crash backtrace from the staged distribution
        timeout-minutes: 2
        shell: pwsh
        run: |
          $crashProfile = Join-Path $env:RUNNER_TEMP ('navo-crash-' + [guid]::NewGuid())
          $env:NAVO_CRASH_TEST = '1'
          $exe = (Resolve-Path -LiteralPath dist/navo.exe).Path
          Rename-Item -LiteralPath target/release/navo.pdb -NewName navo.pdb.saved
          try {
            $probe = Start-Process -FilePath $exe -ArgumentList @('--crash-test', "`"$crashProfile`"") -Wait -PassThru -NoNewWindow
          } finally {
            Rename-Item -LiteralPath target/release/navo.pdb.saved -NewName navo.pdb
          }
          if ($probe.ExitCode -ne 101) { throw "unexpected crash probe exit: $($probe.ExitCode)" }
          $records = @(Get-ChildItem -LiteralPath "$crashProfile/data/logs" -Filter 'crash-*.json')
          if ($records.Count -ne 1) { throw "expected one crash record, got $($records.Count)" }
          $record = Get-Content -LiteralPath $records[0].FullName -Raw | ConvertFrom-Json
          if ($record.message -ne 'Navo CI crash test') { throw 'unexpected panic message' }
          if ($record.backtrace -notmatch 'navo::crash_test\r?\n\s+at [^\r\n]*main\.rs:\d+') { throw 'release backtrace has no Navo crash_test frame with its source location' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: navo-windows-x64-${{ github.sha }}
          path: dist/
      - name: Build the mimalloc A/B exe
        run: cargo build --release -p rusty-app --features mimalloc --target-dir target/mimalloc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: navo-windows-x64-mimalloc-${{ github.sha }}
          path: target/mimalloc/release/navo.exe
          if-no-files-found: error
      - name: listing benchmark, read_dir vs native, 50k files
        continue-on-error: true
        timeout-minutes: 10
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'list-bench'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          for ($i = 0; $i -lt 50000; $i++) { [IO.File]::Create("$dir\f$i.txt").Dispose() }
          cargo run --release -p rusty-fs --example list_bench -- $dir 7
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $unc = '\\localhost\' + ($dir -replace '^([A-Za-z]):', '$1$')
          if (Test-Path -LiteralPath $unc) {
            cargo run --release -p rusty-fs --example list_bench -- $unc 7
          } else {
            Write-Output "share $unc is not reachable, UNC timing skipped"
          }

  perf-windows:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: build-windows
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@fb523f40495206854c36b250850817ae0f83e3d1 # 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: navo-windows-x64-${{ github.sha }}
          path: ${{ runner.temp }}/navo-perf/bin
      - name: Generate fixed two-pane fixture
        run: |
          $perfRoot = Join-Path $env:RUNNER_TEMP 'navo-perf'
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "PERF_ROOT=$perfRoot"
          New-Item -ItemType Directory -Force -Path "$perfRoot/reports" | Out-Null
          cargo xtask perf-fixture "$perfRoot/fixture"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: First launch
        timeout-minutes: 2
        run: |
          & "$env:PERF_ROOT/bin/navo.exe" --metrics "$env:PERF_ROOT/reports/first.json" --left "$env:PERF_ROOT/fixture/A" --right "$env:PERF_ROOT/fixture/B" --profile "$env:PERF_ROOT/profiles/first" | Out-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path -LiteralPath "$env:PERF_ROOT/reports/first.json")) { throw 'first report missing' }
      - name: Five warm launches
        timeout-minutes: 3
        run: |
          foreach ($i in 1..5) {
            & "$env:PERF_ROOT/bin/navo.exe" --metrics "$env:PERF_ROOT/reports/warm-$i.json" --left "$env:PERF_ROOT/fixture/A" --right "$env:PERF_ROOT/fixture/B" --profile "$env:PERF_ROOT/profiles/warm-$i" | Out-Host
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (!(Test-Path -LiteralPath "$env:PERF_ROOT/reports/warm-$i.json")) { throw "warm-$i report missing" }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: navo-perf-windows-${{ github.sha }}
          path: ${{ runner.temp }}/navo-perf/reports/*.json
          if-no-files-found: error
      - name: Performance summary
        if: always()
        run: |
          cargo xtask perf-summary "$env:PERF_ROOT/reports" "$env:GITHUB_STEP_SUMMARY"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  build-linux:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [gate-linux, gate-windows]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@fb523f40495206854c36b250850817ae0f83e3d1 # 1.99.0
        with:
          components: rustfmt, clippy, llvm-tools
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev libvulkan-dev libasound2-dev libzstd-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release -p rusty-app
      - name: Binary size (informational until the alpha features are in)
        continue-on-error: true
        run: cargo xtask binsize target/release/navo
      - run: test "$(target/release/navo --version)" = "navo 0.0.1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: navo-linux-x64-${{ github.sha }}
          path: target/release/navo
