name: spike-windows

on:
  push:
    branches: [spike/gpui-b-variants]
    paths: ["spikes/gpui-b-variants/**", ".github/workflows/spike-windows.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
    defaults:
      run:
        working-directory: spikes/gpui-b-variants
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: spikes/gpui-b-variants
      - run: cargo build --release --locked
      - name: Report size and first frame
        shell: pwsh
        run: |
          $exe = "target/release/gpui-b-variants.exe"
          "size: {0:N1} MB" -f ((Get-Item $exe).Length / 1MB)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rusty-gpui-b-windows-x64
          path: spikes/gpui-b-variants/target/release/gpui-b-variants.exe
          if-no-files-found: error
