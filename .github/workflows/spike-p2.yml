name: spike-p2

on:
  push:
    branches: [p2-spike]
    paths: ["spikes/gpui-b/**", ".github/workflows/spike-p2.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spike-p2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    env:
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
    defaults:
      run:
        working-directory: spikes/gpui-b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@fb523f40495206854c36b250850817ae0f83e3d1 # 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: spikes/gpui-b
      - run: cargo test --release --locked
      - run: cargo build --release --locked
      - name: Run with --metrics
        shell: pwsh
        continue-on-error: true
        run: |
          $exe = (Resolve-Path "target/release/gpui-b.exe").Path
          foreach ($run in 1..3) {
            $out = Join-Path $PWD "metrics-$run.json"
            $p = Start-Process -FilePath $exe -ArgumentList "--rows", "100k", "--metrics", $out -PassThru
            if (-not $p.WaitForExit(90000)) { $p.Kill(); throw "run $run timed out" }
            Get-Content $out
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ferrite-spike-windows-x64-${{ github.sha }}
          path: |
            spikes/gpui-b/target/release/gpui-b.exe
            spikes/gpui-b/metrics-*.json
          if-no-files-found: warn
