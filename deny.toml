[advisories]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2024-0384", reason = "instant: unmaintained, not vulnerable; transitive through gpui-kit 0.7.3; recheck on every gpui-kit update" },
    { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained, not vulnerable; transitive through gpui-kit 0.7.3; recheck on every gpui-kit update" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile: unmaintained, not vulnerable; transitive through gpui-kit 0.7.3; recheck on every gpui-kit update" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz: unmaintained, not vulnerable; transitive through gpui-kit 0.7.3; recheck on every gpui-kit update" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: unmaintained, not vulnerable; transitive through gpui-kit 0.7.3; recheck on every gpui-kit update" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant: unmaintained (merged into zbus 6), not vulnerable; transitive through gpui-kit 0.7.3 (accesskit_unix, atspi); recheck on every gpui-kit update" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: unmaintained (merged into zbus 6), not vulnerable; transitive through gpui-kit 0.7.3 (accesskit_unix, atspi); recheck on every gpui-kit update" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: unmaintained (merged into zbus 6), not vulnerable; transitive through gpui-kit 0.7.3 (accesskit_unix, atspi); recheck on every gpui-kit update" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
]
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
